name: Windows Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test ve EXE derleme
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Testler (çekirdek + ekransız arayüz)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v

      - name: Sürüm bilgisi
        run: |
          if ("$env:GITHUB_REF" -like "refs/tags/v*") { $v = "$env:GITHUB_REF_NAME" } else { $v = "v" + (Get-Content VERSION -Raw).Trim() }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Tek dosya EXE derle (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name NovaTools --icon assets/icon.ico
          --add-data "assets;assets" --collect-data tzdata
          --version-file version_info.txt run.py

      - name: Taşınabilir sürümü derle
        run: >
          pyinstaller --noconfirm --onedir --windowed
          --name NovaTools --icon assets/icon.ico
          --add-data "assets;assets" --collect-data tzdata
          --version-file version_info.txt
          --distpath portable_dist --workpath portable_build run.py

      - name: EXE açılış testi (tek dosya)
        env:
          NOVA_SCREENSHOT_DIR: ${{ github.workspace }}\screenshots
        run: |
          $out = Join-Path $PWD "selftest-onefile.json"
          $p = Start-Process -FilePath "dist\NovaTools.exe" -ArgumentList "--self-test=$out" -Wait -PassThru
          Get-Content $out -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "Self-test başarısız (çıkış kodu $($p.ExitCode))" }

      - name: EXE açılış testi (taşınabilir)
        run: |
          New-Item -ItemType File -Path "portable_dist\NovaTools\portable.txt" -Force | Out-Null
          Set-Content "portable_dist\NovaTools\portable.txt" "Bu dosya varsa veriler program klasöründeki data\ altında saklanır." -Encoding utf8
          $out = Join-Path $PWD "selftest-portable.json"
          $p = Start-Process -FilePath "portable_dist\NovaTools\NovaTools.exe" -ArgumentList "--self-test=$out" -Wait -PassThru
          Get-Content $out -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "Self-test başarısız (çıkış kodu $($p.ExitCode))" }

      - name: Dağıtım dosyalarını hazırla
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist\NovaTools.exe" "release\NovaTools-$env:APP_VERSION.exe"
          Copy-Item README.md, LICENSE "portable_dist\NovaTools\"
          Compress-Archive -Path "portable_dist\NovaTools" -DestinationPath "release\NovaTools-$env:APP_VERSION-Portable.zip"
          $sums = Get-ChildItem release -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $sums | Out-File release\SHA256SUMS.txt -Encoding ascii
          Get-ChildItem release | Format-Table Name, Length
          Get-Content release\SHA256SUMS.txt

      - name: Ekran görüntülerini screenshots dalına yayınla
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path screenshots)) { Write-Host "Ekran görüntüsü yok"; exit 0 }
          $tmp = Join-Path $env:RUNNER_TEMP "shots"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Copy-Item screenshots\*.png $tmp
          Set-Location $tmp
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Ekran görüntüleri ($env:GITHUB_SHA)"
          git push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" HEAD:screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: NovaTools-windows
          path: release/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-reports
          path: |
            selftest-*.json
            screenshots/
          if-no-files-found: ignore

  release:
    name: GitHub Release
    # v* etiketi gönderildiğinde veya main'de VERSION henüz yayınlanmamış bir sürümse
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Sürüm etiketini belirle
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; else tag="v$(tr -d '[:space:]' < VERSION)"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" != refs/tags/v* ]] && gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "$tag zaten yayınlanmış; atlanıyor."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.skip == 'false'
        with:
          name: NovaTools-windows
          path: release
      - uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.skip == 'false'
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Nova Tools ${{ steps.tag.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: release/*
